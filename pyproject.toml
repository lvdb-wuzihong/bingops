[project]
name = "bingops"
version = "0.1.0"
description = "BingOps 运维平台后端"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4.0,<5",
    "httpx>=0.27,<1",
    "structlog>=24.0,<25",
    "email-validator>=2.0,<3",
    "aiokafka>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bingops*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
